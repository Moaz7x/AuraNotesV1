name: Android CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    steps:
      # Subtask 3: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Subtask 4: Setup JDK 20
      - name: Setup JDK 20
        uses: actions/setup-java@v3
        with:
          java-version: '20'
          distribution: 'temurin'
          cache: 'gradle' # Automatically caches Gradle dependencies to speed up builds

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Subtask 5: Run ktlintCheck
      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck --no-daemon

      # Subtask 6: Run Unit Tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon
